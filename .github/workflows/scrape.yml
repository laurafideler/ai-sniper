name: AuctionNinja Scraper Engine
on:
  schedule:
    - cron: "*/20 * * * *" # Triggers automatically every 20 minutes
  workflow_dispatch: # Allows you to manually click a button inside GitHub to force run it anytime

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install Cloud Browser Dependencies
        run: npx playwright install chromium

      - name: Execute Scraper Engine
        run: node scraper-job.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
